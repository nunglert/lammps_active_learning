name: LAMMPS image

# Build the CPU MACE-LAMMPS image (docker/Dockerfile.lammps-mace) and push it
# to GHCR as ghcr.io/<owner>/<repo>/lammps-mace:cpu, which the lammps-smoke
# job in ci.yml runs in. Rebuilding LAMMPS from source is heavy (~minutes),
# so this only runs when it needs to:
#   * a push to main that changes the Dockerfile,
#   * weekly (catches upstream drift in the pinned LAMMPS/mace-torch sources
#     with nothing in this repo having changed),
#   * manually (workflow_dispatch) -- also how to publish the image the first
#     time.
# A PR that changes the Dockerfile only builds it, as a check; it doesn't
# push, so the published image never runs unmerged changes.

on:
  push:
    branches: [main]
    paths:
      - docker/Dockerfile.lammps-mace
  pull_request:
    paths:
      - docker/Dockerfile.lammps-mace
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.lammps-mace
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/lammps-mace:cpu
          # Links the package to this repo, so the repo's GITHUB_TOKEN can
          # pull it in ci.yml even while the package itself is private.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
