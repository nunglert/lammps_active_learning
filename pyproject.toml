# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lammps_active_learning"
dynamic = ["version"]
authors = [
    { name = "Nico Unglert", email = "nico.unglert@tuwien.ac.at" }
]
description = "Composition root for LAMMPS active-learning projects"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]
dependencies = [
    "ase",
    "numpy",
]
readme = "README.md"

[project.optional-dependencies]
run = [
    "remote_handler[dev] @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler.git@dev-NU",
]
ace = [
    "remote_handler[ace] @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler.git@dev-NU",
]
grace = [
    "remote_handler[grace] @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler.git@dev-NU",
]
mace = [
    "remote_handler[mace_freeze] @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler.git@dev-NU",
]
# GPU-accelerated ACE fitting (pacemaker's `tensorpot` backend) AND
# GPU-accelerated ACE committee-uncertainty scoring
# (lammps_al.select.scripts.committee_selection's backend="ace" path) --
# both via the *old*, pre-GRACE-rename tensorpotential API (see
# remote_handler's own [ace_tensorpot_gpu] extra comment). Install in its
# own dedicated environment -- mutually exclusive with [grace] (see above).
# Deliberately NOT included in [all], for the same reason. matscipy (a
# normal, portable PyPI package -- unlike the old tensorpotential snapshot,
# no special version pins) is declared directly here since it's a direct
# dependency of this repo's own committee_selection payload, not something
# remote_handler needs to know about; confirmed substantially faster than
# ASE's own neighbor list at real campaign scale.
ace_tensorpot_gpu = [
    "remote_handler[ace_tensorpot_gpu] @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler.git@dev-NU",
    "matscipy",
]
# ovito's plain PyPI wheel doesn't bundle its own Qt/OpenGL libs and fails
# to import on a headless cluster node missing system libOpenGL.so.0
# (confirmed on dirona) -- install it via conda instead (ovito's own
# import-time warning recommends this too: "conda install
# --strict-channel-priority -c https://conda.ovito.org -c conda-forge
# ovito=3.16.1"), then `pip install` this extra as normal
embedding = [
    "ovito"
]
dashboard = [
    "alviz @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/alviz.git@main",
]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
]
# The sensible default bundle -- every committee backend except
# [ace_tensorpot_gpu], which needs its own dedicated environment and would
# conflict with [grace] here (see that extra's comment above).
all = [
    "lammps_active_learning[dev,run,ace,grace,mace,embedding,dashboard]"
]

[tool.setuptools_scm]
# Single source of truth for the version is the git tag (mirrors jaxrens_al).
# No version file is written; the runtime reads it via importlib.metadata.
# fallback_version keeps the build from erroring on a tagless / shallow clone
# with no git metadata (e.g. an sdist, or a CI checkout without full history).
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the amorphous-embedding sampler's default anneal deck template inside
# the installed package; without this it is missing from a real
# (non-editable) install (editable installs mask this by pointing back at
# src/).
[tool.setuptools.package-data]
lammps_al = ["embedding/scripts/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
markers = [
    "local: runs with no cluster/producer; always runnable",
    "integration: needs a live cluster or producer packages",
    "lammps: needs a MACE-enabled LAMMPS binary on PATH; self-skips otherwise",
]
