# CI for lammps_active_learning.
#
# Installs the package with its private dependency and runs the tests. The
# install IS the check: it exercises the real cross-host dependency pipeline
#   * remote_handler  -> GitLab (same instance) via CI_JOB_TOKEN
# remote_handler's [mace_freeze] extra pulls mace-torch from PUBLIC GitHub over
# https, so (unlike jaxrens_active_learning) no GitHub token is needed here.
#
# One-time prerequisites:
#   1. On `remote_handler`: Settings -> CI/CD -> Job token permissions -> allow
#      this project's token (add lammps_active_learning).
#   2. The runner needs outbound network to gitlab.tuwien.ac.at AND github.com
#      (the latter for the public mace-torch source).
#   3. Enable this project's Container Registry (Settings -> General ->
#      Visibility -> Container Registry) and run the `build-lammps-image` job
#      once manually (`when: manual` still fires it on request even outside
#      its automatic triggers below), so `lammps-smoke` has an image to pull
#      from its very first automatic run. The registry path is taken from the
#      predefined $CI_REGISTRY_IMAGE (never hardcode a registry hostname --
#      it is instance-specific).
#
# The main `test` job builds no image (any docker/kubernetes runner works;
# python:3.13 ships git + compilers for the git-sourced deps, plus an
# apt-installed cmake for pyace's CMake-built extension -- see that job's
# before_script). `lammps-smoke`
# runs automatically on every pipeline against the prebuilt MACE-LAMMPS image;
# `build-lammps-image` itself only (re)builds and pushes that image when
# `docker/Dockerfile.lammps-mace` changes or on a schedule -- see each job's
# own comment for the rationale.

stages:
  - build
  - resolve
  - test

# Build & push the CPU MACE-LAMMPS image (docker/Dockerfile.lammps-mace) to this
# project's registry with kaniko (no privileged docker needed on k8s runners).
# Automatic, but only when it needs to be: rebuilding LAMMPS from source is
# heavy (~minutes), so this runs when the Dockerfile itself changes (a commit
# touching it, on any branch/MR) or on a schedule (catches upstream drift in
# the pinned LAMMPS/mace-torch sources with nothing in this repo having
# changed -- same rationale as the top-level `workflow:` scheduled runs).
# Every other commit reuses the already-published :cpu image untouched.
# Building locally and `docker push`ing to $CI_REGISTRY_IMAGE/lammps-mace:cpu
# works too (and is easier to iterate on while validating the Dockerfile).
build-lammps-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}"
        --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile.lammps-mace"
        --destination "${CI_REGISTRY_IMAGE}/lammps-mace:cpu"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - docker/Dockerfile.lammps-mace
    # Manual escape hatch: force a rebuild on an unrelated commit (e.g. to
    # pick up upstream ACEsuit/lammps or mace-torch changes) without waiting
    # for the next schedule.
    - when: manual
  allow_failure: true

# Resolves the ":cpu" tag's current digest and hands it to lammps-smoke as
# `image: $LAMMPS_SMOKE_IMAGE` (via a dotenv artifact). This exists because
# this runner's Kubernetes executor has `allowed_pull_policies: []` --
# `pull_policy: always` on the job's `image:` is unconditionally rejected
# ("invalid pull policy ... not one of the allowed_pull_policies"), so a
# forced pull isn't an option here, and the default `IfNotPresent` would
# happily reuse a node-cached, stale `:cpu` image after a rebuild. Pulling by
# digest instead of the mutable tag sidesteps the whole problem: a digest is
# content-addressed, so `IfNotPresent` is *correct* there -- no forced pull
# needed, and no runner-admin config change either.
#
# Its own `resolve` stage (after `build`, before `test`), not a `needs:` edge
# on build-lammps-image: build-lammps-image's rules always leave it present
# but `when: manual` on every commit that doesn't touch the Dockerfile (see
# its own comment), and a `needs:` on a manual job -- even with
# `allow_failure: true` + `optional: true`, which is supposed to make this
# non-blocking -- has been observed to leave this job stalled waiting for
# that manual job to be played, defeating the "no rebuild required" point of
# this whole job. Plain stage ordering does not have that problem (a pending
# manual job with `allow_failure: true` never blocks stage completion), and
# still runs this after a same-pipeline rebuild whenever one actually
# happens (Dockerfile-changed rebuilds are automatic, not manual, so they
# finish within the `build` stage before `resolve` starts) -- so it still
# always reflects whatever is currently published, not just the pipeline's
# own build.
resolve-lammps-image:
  stage: resolve
  image: alpine:3.20
  script:
    - apk add --no-cache curl jq
    # Single-quoted (not the multi-line plain-scalar style used elsewhere in
    # this file): a bare ": " inside "JOB-TOKEN: ${CI_JOB_TOKEN}" is a YAML
    # mapping separator in a plain scalar, which silently turns the script
    # line into a YAML mapping instead of a string -- quoting avoids that.
    - 'REPO_ID=$(curl -sf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories" | jq -r ''.[] | select(.path | endswith("/lammps-mace")) | .id'')'
    - test -n "${REPO_ID}" || { echo "lammps-mace repository not found in the registry -- has build-lammps-image ever run?"; exit 1; }
    - 'DIGEST=$(curl -sf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/cpu" | jq -r ''.digest'')'
    - test -n "${DIGEST}" -a "${DIGEST}" != "null" || { echo "no digest for the :cpu tag"; exit 1; }
    - echo "Resolved lammps-mace:cpu -> ${DIGEST}"
    - echo "LAMMPS_SMOKE_IMAGE=${CI_REGISTRY_IMAGE}/lammps-mace@${DIGEST}" >> resolve.env
  artifacts:
    reports:
      dotenv: resolve.env
  # allow_failure: true for the same reason as lammps-smoke below (external
  # registry dependency, optional tier -- see that job's comment): GitLab
  # still runs a `needs:`-dependent job when the needed job failed but was
  # allowed to, so lammps-smoke still starts, just with an empty
  # $LAMMPS_SMOKE_IMAGE -- a clear "empty image name" error in *its* logs
  # rather than this job reddening the whole pipeline over an optional tier.
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Full history + tags so setuptools-scm can derive the version (a shallow
  # clone with no tags would fall back to fallback_version = 0.0.0).
  GIT_DEPTH: "0"
  GIT_FETCH_EXTRA_FLAGS: --tags

# Run on branch pushes, merge requests, and scheduled pipelines (a cron defined
# in Build -> Pipeline schedules) -- without duplicate pipelines. Scheduled runs
# are the safety net against silent API drift in remote_handler: nothing changed
# here, but the producer package's dev branch may have moved.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

test:
  stage: test
  image: python:3.13
  before_script:
    # remote_handler is pinned as an SSH URL in pyproject (so humans with SSH
    # keys -- dev machines, clusters -- install with zero config). CI has no SSH
    # key, so it rewrites that SSH URL to authenticated HTTPS at clone time via
    # CI_JOB_TOKEN.
    - git config --global
        url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.tuwien.ac.at/".insteadOf
        "ssh://git@gitlab.tuwien.ac.at/"
    - python -V
    # cmake: remote_handler's [ace] extra (pulled in by [run] below) installs
    # pyace (git+https://github.com/ICAMS/python-ace.git), which builds a
    # C++/Cython extension via CMake at install time -- not preinstalled on
    # plain python:3.13.
    - apt-get update && apt-get install -y --no-install-recommends cmake
    - pip install --upgrade pip
    # Full install: remote_handler (GitLab) + its mace/ace/grace stacks (public
    # GitHub/PyPI) + dev. Heavy (torch/mace), but the resolve is the cross-host
    # check.
    - pip install ".[all]"
    - python -c "import lammps_al; from lammps_al.run.sampler import LammpsSampler; print('install OK')"
  script:
    # -m 'not lammps': the real-binary smoke test runs in lammps-smoke below,
    # on the MACE-LAMMPS image. Everything else (unit + committee scoring) runs
    # here and the lammps tier self-skips anyway, but excluding it is explicit.
    - pytest -ra -m 'not lammps' --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Real end-to-end LAMMPS smoke test on the prebuilt MACE-LAMMPS image (see
# docker/Dockerfile.lammps-mace). The image already ships lmp + mace-torch +
# torch (CPU); here we add remote_handler (base, no mace extra) + this package
# without reinstalling the heavy stack, then run only the `lammps` tier.
#
# Automatic on every commit now (validated with a real build+run -- see
# CHANGELOG). `image:` is the digest `resolve-lammps-image` resolved (via its
# dotenv artifact, consumed as $LAMMPS_SMOKE_IMAGE), not a mutable tag -- see
# that job's comment for why. `needs: resolve-lammps-image` supplies that
# variable and, via the `build` -> `resolve` stage ordering (see
# resolve-lammps-image's comment for why that's a plain stage rather than a
# `needs:` edge), still runs after a same-pipeline rebuild when the
# Dockerfile just changed. `allow_failure: true` stays on: this tier depends
# on an external image + registry, so a transient pull/registry hiccup
# shouldn't block the pipeline.
lammps-smoke:
  stage: test
  image:
    name: $LAMMPS_SMOKE_IMAGE
  needs:
    - resolve-lammps-image
  allow_failure: true
  before_script:
    - git config --global
        url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.tuwien.ac.at/".insteadOf
        "ssh://git@gitlab.tuwien.ac.at/"
    - pip install --no-cache-dir
        "remote_handler @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler.git@dev-NU"
    # Install this package + its [dev] extra (pytest). NOT [run]: the heavy
    # mace/torch stack is already in the image, and remote_handler was installed
    # above. Base ([ase, numpy]) + [dev] are light and won't touch torch/mace.
    - pip install --no-cache-dir ".[dev]"
    # --- LAMMPS diagnostics (none of these fail the job) --------------------
    # Which LAMMPS is baked into THIS image? Absence of the file => an old image
    # built before the provenance change (i.e. a stale/cached or pre-edit build).
    - 'cat /opt/lammps-build-info.txt || echo "no build-info: OLD image"'
    # Is lmp on PATH? (no pipe: `... | head` would SIGPIPE lmp and, under the
    # runner's `set -o pipefail`, fail the job).
    - 'command -v lmp && echo "lmp found" || echo "lmp NOT on PATH"'
    # Missing shared libraries (e.g. libtorch) show up here as "not found".
    - 'ldd "$(command -v lmp)" 2>&1 || true'
    # Does it actually run + list packages (ML-MACE must be present)?
    - 'lmp -h > lmp_help.txt 2>&1; echo "lmp -h exit=$?"'
    - 'grep -iA40 "Installed packages" lmp_help.txt || tail -30 lmp_help.txt || true'
  script:
    # -s + live logs: the payload logs LAMMPS's own stderr on a failed run, so a
    # runtime lmp error is visible here. --basetemp under the project dir so the
    # run's out/lmp.log + dump land in the uploaded artifacts.
    - pytest -ra -m lammps -s --log-cli-level=INFO
        --basetemp="${CI_PROJECT_DIR}/pytest-tmp"
        --junitxml=report-lammps.xml
  artifacts:
    paths:
      - lmp_help.txt
      - pytest-tmp/
    when: always
    reports:
      junit: report-lammps.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
